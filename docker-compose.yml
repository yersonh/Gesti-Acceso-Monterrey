services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # URL pública del servidor (sin barra final)
      APP_URL: ${APP_URL}
      # Conexión a la base de datos PostgreSQL
      DATABASE_URL: ${DATABASE_URL}
      # Correo electrónico (Brevo)
      BREVO_API_KEY: ${BREVO_API_KEY}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      # WhatsApp Business API (Meta Cloud API)
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      META_WHATSAPP_TEMPLATE: ${META_WHATSAPP_TEMPLATE:-valoracion_visita}
    volumes:
      # Persistir uploads entre reinicios del contenedor
      - uploads_data:/app/uploads
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-railway}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./esquema.sql:/docker-entrypoint-initdb.d/esquema.sql
    ports:
      # Solo exponer al host si el IT necesita acceso directo desde pgAdmin
      # Comentar esta línea si no se necesita acceso externo a la DB
      - "5432:5432"

volumes:
  postgres_data:
  uploads_data:
